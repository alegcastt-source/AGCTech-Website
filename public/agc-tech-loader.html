<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #03030a;
    }
  </style>
</head>
<body>
<div id="agc-tech-loader" aria-label="Neon hexagon loader transitions into a smashing AGC Tech logo animation">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Michroma&family=Orbitron:wght@400;500;700&display=swap");

    @font-face {
      font-family: "AGC Angular";
      src:
        local("Dynamic Alphabet"),
        local("DynamicAlphabet"),
        local("Dynamic Alphabet Regular"),
        local("Angular"),
        local("Angular Font"),
        local("Angilar"),
        local("Angilar Regular");
      font-display: swap;
    }

    @font-face {
      font-family: "TECH Dynamic";
      src:
        local("Dynamic"),
        local("Dynamic Font"),
        local("Dynamix"),
        local("Dynamix Regular");
      font-display: swap;
    }

    #agc-tech-loader {
      --cyan: #6A2562;
      --cyan-deep: #361441;
      --violet: #52040F;
      --ink: #020106;
      --white: #E6E7F0;
      --chrome: #A9C9E5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--ink);
      font-family: Impact, Haettenschweiler, "Arial Black", system-ui, sans-serif;
      animation:
        bg-flip 9.2s cubic-bezier(.5, 0, .08, 1) forwards,
        screen-shake 9.2s linear forwards;
    }

    #agc-tech-loader * {
      box-sizing: border-box;
    }

    #agc-tech-loader .hex-loader,
    #agc-tech-loader .brand {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    #agc-tech-loader .hex-loader {
      isolation: isolate;
      animation: loader-fade 9.2s ease forwards;
    }

    #agc-tech-loader .energy-core {
      position: absolute;
      width: min(18vmin, 140px);
      aspect-ratio: 1;
      clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0 50%);
      background:
        radial-gradient(circle, rgba(230, 231, 240, .96) 0 18%, transparent 19%),
        linear-gradient(135deg, var(--cyan), var(--cyan-deep));
      filter:
        drop-shadow(0 0 10px rgba(132, 33, 125, .72))
        drop-shadow(0 0 34px rgba(53, 16, 70, .42));
      animation: core-breathe 5s cubic-bezier(.45, 0, .18, 1) forwards;
    }

    #agc-tech-loader .hex-ring {
      position: absolute;
      width: min(var(--size), 92vmin);
      aspect-ratio: 1;
      transform: rotate(var(--spin));
      animation: orbit 5s cubic-bezier(.42, 0, .12, 1) forwards;
    }

    #agc-tech-loader .hex {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--hex);
      aspect-ratio: 1;
      clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0 50%);
      background: linear-gradient(135deg, rgba(132, 33, 125, .96), rgba(53, 16, 70, .22));
      transform:
        rotate(var(--a))
        translateX(calc(var(--size) * .5))
        rotate(calc(var(--a) * -1))
        scale(.68);
      opacity: 0;
      filter:
        drop-shadow(0 0 8px rgba(132, 33, 125, .78))
        drop-shadow(0 0 24px rgba(53, 16, 70, .34));
      animation: hex-ripple 5s cubic-bezier(.22, .72, .1, 1) forwards;
      animation-delay: var(--d);
    }

    #agc-tech-loader .hex::after {
      content: "";
      position: absolute;
      inset: 13%;
      clip-path: inherit;
      background: var(--ink);
      opacity: .9;
    }

    #agc-tech-loader .r1 { --size: 140px; --hex: 19px; --spin: 0deg; }
    #agc-tech-loader .r2 { --size: 250px; --hex: 22px; --spin: 15deg; }
    #agc-tech-loader .r3 { --size: 370px; --hex: 26px; --spin: -12deg; }
    #agc-tech-loader .r4 { --size: 510px; --hex: 30px; --spin: 24deg; }
    #agc-tech-loader .r5 { --size: 650px; --hex: 33px; --spin: -20deg; }

    #agc-tech-loader .h1 { --a: 0deg; --d: .00s; }
    #agc-tech-loader .h2 { --a: 60deg; --d: .06s; }
    #agc-tech-loader .h3 { --a: 120deg; --d: .12s; }
    #agc-tech-loader .h4 { --a: 180deg; --d: .18s; }
    #agc-tech-loader .h5 { --a: 240deg; --d: .24s; }
    #agc-tech-loader .h6 { --a: 300deg; --d: .30s; }

    #agc-tech-loader .streak {
      position: absolute;
      width: min(88vmin, 680px);
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(132, 33, 125, .82), transparent);
      opacity: 0;
      transform: rotate(var(--r)) scaleX(.08);
      filter: drop-shadow(0 0 12px rgba(132, 33, 125, .55));
      animation: streak-sweep 5s cubic-bezier(.22, .7, .16, 1) forwards;
      animation-delay: var(--d);
    }

    #agc-tech-loader .s1 { --r: 0deg; --d: .45s; }
    #agc-tech-loader .s2 { --r: 60deg; --d: .9s; }
    #agc-tech-loader .s3 { --r: -60deg; --d: 1.25s; }
    #agc-tech-loader .s4 { --r: 120deg; --d: 1.65s; }

    #agc-tech-loader .brand {
      perspective: 950px;
      pointer-events: none;
    }

    #agc-tech-loader .explosion {
      position: absolute;
      z-index: 1;
      width: min(92vmin, 780px);
      aspect-ratio: 1;
      opacity: 0;
      transform: scale(.18) rotate(-10deg);
      animation: explosion-bloom 9.2s cubic-bezier(.16, .82, .08, 1) forwards;
      filter:
        drop-shadow(0 0 16px rgba(132, 33, 125, .7))
        drop-shadow(0 0 42px rgba(53, 16, 70, .36));
    }

    #agc-tech-loader .explosion span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--w);
      height: var(--h);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .98), var(--cyan), transparent);
      clip-path: polygon(0 50%, 78% 0, 100% 50%, 78% 100%);
      transform-origin: left center;
      transform: rotate(var(--r)) translateX(var(--x)) scaleX(.12);
      opacity: 0;
      animation: shard-shot 9.2s cubic-bezier(.12, .9, .16, 1) forwards;
      animation-delay: var(--d);
    }

    #agc-tech-loader .b1 { --r: 0deg; --x: 90px; --w: 310px; --h: 13px; --d: 5.12s; }
    #agc-tech-loader .b2 { --r: 22deg; --x: 72px; --w: 240px; --h: 10px; --d: 5.16s; }
    #agc-tech-loader .b3 { --r: -24deg; --x: 78px; --w: 260px; --h: 11px; --d: 5.14s; }
    #agc-tech-loader .b4 { --r: 58deg; --x: 64px; --w: 215px; --h: 9px; --d: 5.2s; }
    #agc-tech-loader .b5 { --r: -62deg; --x: 66px; --w: 230px; --h: 9px; --d: 5.18s; }
    #agc-tech-loader .b6 { --r: 102deg; --x: 52px; --w: 190px; --h: 8px; --d: 5.23s; }
    #agc-tech-loader .b7 { --r: -110deg; --x: 56px; --w: 205px; --h: 8px; --d: 5.22s; }
    #agc-tech-loader .b8 { --r: 158deg; --x: 62px; --w: 250px; --h: 10px; --d: 5.15s; }
    #agc-tech-loader .b9 { --r: -158deg; --x: 58px; --w: 235px; --h: 10px; --d: 5.17s; }
    #agc-tech-loader .b10 { --r: 202deg; --x: 74px; --w: 285px; --h: 12px; --d: 5.13s; }
    #agc-tech-loader .b11 { --r: 248deg; --x: 54px; --w: 210px; --h: 8px; --d: 5.2s; }
    #agc-tech-loader .b12 { --r: 294deg; --x: 60px; --w: 225px; --h: 9px; --d: 5.19s; }

    #agc-tech-loader .smoke {
      display: none;
    }

    #agc-tech-loader .impact-flash {
      display: none;
    }

    #agc-tech-loader .slam-field {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0;
      animation: slam-field 9.2s linear forwards;
    }

    #agc-tech-loader .plate-field {
      position: absolute;
      z-index: 1;
      width: min(98vmin, 900px);
      height: min(58vmin, 460px);
      opacity: 0;
      transform: scale(.78) rotate(-4deg);
      animation: plate-field-hit 9.2s cubic-bezier(.14, .84, .16, 1) forwards;
    }

    #agc-tech-loader .plate {
      position: absolute;
      height: var(--h);
      width: var(--w);
      left: 50%;
      top: 50%;
      background:
        linear-gradient(90deg, transparent 0 7%, rgba(132, 33, 125, .78) 8% 10%, rgba(255, 255, 255, .92) 11% 13%, rgba(5, 5, 5, .95) 14% 86%, rgba(53, 16, 70, .72) 87% 90%, transparent 91% 100%);
      clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
      transform: translate(var(--x), var(--y)) rotate(var(--r)) scaleX(0);
      transform-origin: center;
      filter:
        drop-shadow(0 0 14px rgba(132, 33, 125, .56))
        drop-shadow(0 18px 28px rgba(0, 0, 0, .42));
      animation: plate-smash 9.2s cubic-bezier(.12, .86, .16, 1) forwards;
      animation-delay: var(--d);
    }

    #agc-tech-loader .q1 { --x: -50%; --y: -145%; --r: -7deg; --w: 92%; --h: 56px; --d: 5.22s; }
    #agc-tech-loader .q2 { --x: -48%; --y: -55%; --r: 3deg; --w: 104%; --h: 42px; --d: 5.3s; }
    #agc-tech-loader .q3 { --x: -52%; --y: 58%; --r: -4deg; --w: 96%; --h: 48px; --d: 5.44s; }
    #agc-tech-loader .q4 { --x: -47%; --y: 140%; --r: 7deg; --w: 88%; --h: 38px; --d: 5.58s; }
    #agc-tech-loader .q5 { --x: -80%; --y: -8%; --r: -58deg; --w: 54%; --h: 18px; --d: 5.36s; }
    #agc-tech-loader .q6 { --x: 28%; --y: -6%; --r: 56deg; --w: 50%; --h: 18px; --d: 5.48s; }

    #agc-tech-loader .impact-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(94vmin, 820px);
      height: var(--h);
      background: linear-gradient(90deg, transparent, rgba(132, 33, 125, .92), rgba(255, 255, 255, .98), rgba(124, 58, 237, .46), transparent);
      transform: translate(-50%, -50%) rotate(var(--r)) scaleX(0);
      transform-origin: center;
      filter: drop-shadow(0 0 18px rgba(132, 33, 125, .66));
      animation: impact-bar 9.2s cubic-bezier(.16, .86, .18, 1) forwards;
      animation-delay: var(--d);
    }

    #agc-tech-loader .p1 { --r: 0deg; --h: 5px; --d: 5.18s; }
    #agc-tech-loader .p2 { --r: 11deg; --h: 3px; --d: 5.23s; }
    #agc-tech-loader .p3 { --r: -12deg; --h: 3px; --d: 5.25s; }
    #agc-tech-loader .p4 { --r: 90deg; --h: 4px; --d: 5.2s; }
    #agc-tech-loader .p5 { --r: 42deg; --h: 2px; --d: 5.28s; }
    #agc-tech-loader .p6 { --r: -44deg; --h: 2px; --d: 5.3s; }

    #agc-tech-loader .font-stage {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      width: min(94vmin, 820px);
      height: min(48vmin, 390px);
      opacity: 0;
      transform: translate(-50%, calc(-50% + 4vmin)) scale(.92);
      animation: font-stage-hit 9.2s cubic-bezier(.14, .84, .16, 1) forwards;
    }

    #agc-tech-loader .side-glow {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 47%;
      width: min(94vmin, 760px);
      height: min(22vmin, 170px);
      background:
        radial-gradient(ellipse at center, rgba(255, 255, 255, .9) 0 9%, rgba(244, 167, 255, .56) 20%, rgba(53, 16, 70, .28) 42%, rgba(44, 30, 118, .13) 62%, transparent 76%),
        linear-gradient(90deg, transparent, rgba(0, 80, 190, .2), rgba(255, 255, 255, .58), rgba(74, 205, 255, .3), rgba(38, 28, 110, .12), transparent);
      opacity: 0;
      transform: translate(-50%, -50%) scaleX(.45);
      filter: blur(8px);
      animation: side-glow-hit 9.2s cubic-bezier(.16, .76, .18, 1) forwards;
    }

    #agc-tech-loader .burst-crack {
      position: absolute;
      z-index: 2;
      width: min(118vmin, 1040px);
      aspect-ratio: 16 / 9;
      opacity: 0;
      transform: scale(.86);
      filter:
        drop-shadow(0 0 8px rgba(255, 255, 255, .9))
        drop-shadow(0 0 22px rgba(132, 33, 125, .62));
      animation: burst-crack-flash 9.2s linear forwards;
    }

    #agc-tech-loader .burst-crack path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: burst-crack-draw 9.2s cubic-bezier(.12, .78, .16, 1) forwards;
    }

    #agc-tech-loader .crack-heavy {
      stroke: rgba(255, 255, 255, .96);
      stroke-width: 4.4;
    }

    #agc-tech-loader .crack-light {
      stroke: rgba(132, 33, 125, .72);
      stroke-width: 1.7;
    }

    #agc-tech-loader .word {
      position: absolute;
      left: 0;
      right: 0;
      margin: 0;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 0;
      color: #070707;
      -webkit-text-stroke: clamp(1.5px, .5vmin, 5px) var(--cyan);
      text-shadow:
        .045em .045em 0 rgba(124, 58, 237, .38),
        0 0 14px rgba(132, 33, 125, .5),
        0 0 34px rgba(53, 16, 70, .26);
      line-height: .78;
      font-weight: 900;
      transform-style: preserve-3d;
      animation: neon-final 9.2s linear forwards;
    }

    #agc-tech-loader .word::before,
    #agc-tech-loader .word::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: transparent;
      -webkit-text-stroke: clamp(1px, .34vmin, 3px) rgba(132, 33, 125, .72);
      opacity: 0;
      pointer-events: none;
      text-shadow:
        0 0 10px rgba(132, 33, 125, .72),
        0 0 26px rgba(53, 16, 70, .4);
    }

    #agc-tech-loader .word::before {
      transform: translateX(-.12em);
      animation: text-afterimage-left 9.2s linear forwards;
    }

    #agc-tech-loader .word::after {
      transform: translateX(.12em);
      animation: text-afterimage-right 9.2s linear forwards;
    }

    #agc-tech-loader .tech::before,
    #agc-tech-loader .tech::after {
      content: none;
      display: none;
    }

    #agc-tech-loader .agc {
      top: 18%;
      font-family: "AGC Angular", "Bangers", "Bebas Neue", "Arial Black", Impact, Haettenschweiler, sans-serif;
      font-size: clamp(76px, 17vmin, 158px);
      letter-spacing: .08em;
      transform: translateY(-12%) rotateZ(0deg) skewX(-10deg) scaleX(1.08);
      opacity: 0;
      animation:
        agc-strike 9.2s cubic-bezier(.16, .8, .12, 1) forwards,
        neon-final 9.2s linear forwards;
    }

    #agc-tech-loader .tech {
      left: 40%;
      right: auto;
      top: 58%;
      font-family: "TECH Dynamic", "Bangers", "Bebas Neue", "Arial Black", Impact, Haettenschweiler, sans-serif;
      font-size: clamp(54px, 12vmin, 120px);
      font-style: italic;
      letter-spacing: .12em;
      text-align: left;
      opacity: 0;
      transform-origin: center;
      transform: translate3d(132vw, -10vh, 260px) rotateZ(0deg) skewX(-12deg) scale(2.45);
      animation:
        tech-smash 9.2s cubic-bezier(.14, .86, .14, 1) forwards,
        neon-final 9.2s linear forwards;
    }

    #agc-tech-loader .lower-lockup {
      position: absolute;
      left: 50%;
      top: 32%;
      width: min(96vmin, 980px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 4vmin, 54px);
      transform: translateX(-50%);
    }

    #agc-tech-loader .lower-lockup .word {
      position: relative;
      left: auto;
      right: auto;
      top: auto;
      flex: 0 1 auto;
      min-width: 0;
      white-space: nowrap;
      font-family: "Michroma", "Orbitron", "AGC Angular", "TECH Dynamic", system-ui, sans-serif;
      font-style: normal;
      font-weight: 400;
      letter-spacing: .16em;
      -webkit-text-stroke: 0 transparent;
      text-shadow:
        0 0 8px rgba(255, 255, 255, .24),
        0 0 22px rgba(132, 33, 125, .28);
      line-height: 1;
    }

    #agc-tech-loader .lower-lockup .word::before,
    #agc-tech-loader .lower-lockup .word::after {
      content: none;
      display: none;
    }

    #agc-tech-loader .lower-lockup .agc {
      font-size: clamp(46px, 9.5vmin, 96px);
      padding-bottom: .11em;
      border-bottom: 0;
      transform: rotateZ(0deg) skewX(0deg) scaleX(1);
      animation:
        agc-strike 9.2s cubic-bezier(.16, .8, .12, 1) forwards,
        arch-final-agc 9.2s linear forwards;
    }

    #agc-tech-loader .lower-lockup .tech {
      font-size: clamp(46px, 9.5vmin, 96px);
      letter-spacing: .18em;
      text-align: left;
      animation:
        tech-smash 9.2s cubic-bezier(.14, .86, .14, 1) forwards,
        arch-final-tech 9.2s linear forwards;
    }

    #agc-tech-loader .shock {
      position: absolute;
      z-index: 2;
      top: 66%;
      width: min(84vmin, 720px);
      height: 5px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
      opacity: 0;
      transform: scaleX(0) skewX(-28deg);
      filter: drop-shadow(0 0 18px rgba(132, 33, 125, .8));
      animation: shock 9.2s linear forwards;
    }

    #agc-tech-loader .angular-sigil {
      position: absolute;
      z-index: 4;
      left: 31.5%;
      top: 66%;
      width: min(15vmin, 118px);
      aspect-ratio: 1;
      opacity: 0;
      transform: translate(-50%, -50%) scale(.62);
      filter: drop-shadow(0 0 10px rgba(132, 33, 125, .7));
      animation: sigil-arrive 9.2s cubic-bezier(.18, .8, .18, 1) forwards;
    }

    #agc-tech-loader .lower-lockup .angular-sigil {
      position: relative;
      left: auto;
      top: auto;
      flex: 0 0 auto;
      width: clamp(78px, 15vmin, 128px);
      transform: scale(.62);
      animation: sigil-arrive-inline 9.2s cubic-bezier(.18, .8, .18, 1) forwards;
    }

    #agc-tech-loader .angular-sigil .hex-shell {
      fill: rgba(255, 255, 255, .96);
      stroke: rgba(255, 255, 255, .96);
      stroke-width: 3.4;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    #agc-tech-loader .angular-sigil .arrow-black,
    #agc-tech-loader .angular-sigil .arrow-cyan,
    #agc-tech-loader .angular-sigil .snow-branch {
      fill: none;
      stroke-width: 3.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    #agc-tech-loader .angular-sigil .arrow-black {
      stroke: rgba(0, 0, 0, .96);
    }

    #agc-tech-loader .angular-sigil .arrow-cyan {
      stroke: rgba(132, 33, 125, .95);
    }

    #agc-tech-loader .angular-sigil .snow-branch {
      stroke: currentColor;
    }

    #agc-tech-loader .angular-sigil .cyan-branch {
      color: rgba(132, 33, 125, .95);
      animation: branch-cyan-switch 2.2s steps(1, end) infinite;
    }

    #agc-tech-loader .angular-sigil .black-branch {
      color: rgba(0, 0, 0, .96);
      animation: branch-black-switch 2.2s steps(1, end) infinite;
    }

    #agc-tech-loader .angular-sigil .snow-branch {
      stroke-width: 2.1;
    }

    #agc-tech-loader .angular-sigil .center-emblem polygon {
      fill: rgba(106, 37, 98, .86);
      stroke: var(--white);
      stroke-width: 1.8;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      filter:
        drop-shadow(0 0 5px rgba(169, 201, 229, .76))
        drop-shadow(0 0 14px rgba(106, 37, 98, .72));
    }

    #agc-tech-loader .angular-sigil .center-emblem path {
      fill: none;
      stroke: var(--chrome);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    #agc-tech-loader .angular-sigil .swirl {
      fill: none;
      stroke: rgba(106, 37, 98, .86);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 44 18;
      vector-effect: non-scaling-stroke;
    }

    @keyframes bg-flip {
      0%, 55% { background: var(--white); }
      67%, 100% { background: var(--ink); }
    }

    @keyframes screen-shake {
      0%, 55% { transform: translate3d(0, 0, 0); }
      57% { transform: translate3d(-1.2vmin, 0, 0); }
      58% { transform: translate3d(1.4vmin, 0, 0); }
      59% { transform: translate3d(-1vmin, 0, 0); }
      60% { transform: translate3d(.9vmin, 0, 0); }
      62% { transform: translate3d(-.45vmin, 0, 0); }
      64% { transform: translate3d(.22vmin, 0, 0); }
      66%, 100% { transform: translate3d(0, 0, 0); }
    }

    @keyframes loader-fade {
      0%, 51% { opacity: 1; transform: scale(1); }
      60%, 100% { opacity: 0; transform: scale(.82); }
    }

    @keyframes orbit {
      0% { transform: rotate(var(--spin)) scale(.34); }
      54% { transform: rotate(calc(var(--spin) + 240deg)) scale(1.06); }
      100% { transform: rotate(calc(var(--spin) + 320deg)) scale(1.14); }
    }

    @keyframes hex-ripple {
